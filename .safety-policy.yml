version: '3.0'

scanning-settings:
  max-depth: 6
  exclude: 
    - '.poetry'
  include-files: []
  system:
    targets: []


report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      cvss-severity: []
      # nltk is not a project dependency: it is pulled in transitively by the
      # `safety` scanner itself (safety -> nltk>=3.9), i.e. dev-only tooling
      # that never ships or runs as part of statsuite-lib. As of 2026-09-22
      # there is no patched nltk release (3.9.2 is latest with fixes; 3.10.3
      # remains vulnerable too) so these findings cannot be resolved by
      # upgrading. Re-review before the expiry date and drop these entries
      # once a fixed nltk (or a safety release that no longer depends on it)
      # is available.
      vulnerabilities:
        SFTY-20260901-40389: &nltk-ignore
          reason: "Unfixed transitive dep of safety CLI (nltk); not shipped/runtime code"
          expires: '2026-12-31'
        SFTY-20260908-76797: *nltk-ignore
        SFTY-20260908-96400: *nltk-ignore
        SFTY-20260218-01424: *nltk-ignore
        SFTY-20260908-82787: *nltk-ignore
        89827: *nltk-ignore
